<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milo Lin — portfolio preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   MILO LIN — PORTFOLIO
   Style follows the original site: pure black, white text at stepped opacities,
   one cyan accent, 1px hairline borders, square corners, 900px centred column.
   No gradients, no glows, no drop shadows.
   Headers use Montserrat to match milolinonline.com.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --bg: #000000;
  --panel: #0a0a0a;

  --text: #ffffff;
  --text-70: rgba(255, 255, 255, 0.7);
  --text-50: rgba(255, 255, 255, 0.5);
  --text-40: rgba(255, 255, 255, 0.4);
  --text-30: rgba(255, 255, 255, 0.3);

  --line: rgba(255, 255, 255, 0.1);
  --line-strong: rgba(255, 255, 255, 0.2);

  /* The one accent. Everything cyan on the site comes from here. */
  --accent: #22d3ee;
  --accent-line: rgba(34, 211, 238, 0.5);
  --accent-wash: rgba(34, 211, 238, 0.06);

  /* Swap this one line to change every header on the site. */
  --display: 'Montserrat', ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
  --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --measure: 900px;
  --gutter: 24px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);

  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

img {
  display: block;
  max-width: 100%;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
}

a {
  color: inherit;
}

:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── Shell ──────────────────────────────────────────────────────────────── */

.wrap {
  max-width: var(--measure);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.page {
  min-height: 100vh;
  padding-top: 80px;
  padding-bottom: 64px;
}

.section {
  margin-bottom: 64px;
}

/* The small grey uppercase label above every section. */
.section-label {
  font-family: var(--display);
  color: var(--text-40);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin: 0 0 16px;
}

.panel {
  border: 1px solid var(--line);
  padding: 24px;
}

.skip-link {
  position: absolute;
  left: -9999px;
}
.skip-link:focus {
  left: 16px;
  top: 12px;
  z-index: 200;
  background: #000;
  border: 1px solid var(--line-strong);
  padding: 10px 16px;
}

/* ── Nav ────────────────────────────────────────────────────────────────── */

.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 60;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.nav-inner {
  max-width: var(--measure);
  margin-inline: auto;
  padding: 0 var(--gutter);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.nav-mark {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 9px;
}

.nav-mark svg {
  color: var(--accent);
  flex: none;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-wrap: wrap;
}

.nav-link {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-40);
  padding: 8px 10px;
  cursor: pointer;
  text-decoration: none;
  transition: color 0.2s var(--ease);
}

.nav-link:hover,
.nav-link.is-active {
  color: var(--text);
}

.nav-icon {
  color: var(--text-40);
  display: inline-flex;
  padding: 8px;
  transition: color 0.2s var(--ease);
}
.nav-icon:hover {
  color: var(--text);
}

/* ── Header ─────────────────────────────────────────────────────────────── */

.masthead {
  text-align: center;
  padding: 48px 0;
}

.masthead h1 {
  font-family: var(--display);
  color: var(--text);
  font-size: clamp(32px, 8vw, 56px);
  font-weight: 200;
  letter-spacing: 0.2em;
  margin: 0 0 12px;
}

.masthead p {
  font-family: var(--display);
  color: var(--text-40);
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin: 0;
}

.masthead-portrait {
  margin: 0 auto 28px;
  width: 200px;
}

.masthead-portrait img {
  width: 100%;
  height: auto;
  border: 1px solid var(--line-strong);
}

.masthead-portrait figcaption {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-30);
  margin-top: 8px;
}

/* ── About ──────────────────────────────────────────────────────────────── */

.about p {
  color: var(--text-70);
  font-size: 14px;
  line-height: 1.7;
  margin: 0;
}

.about p + p {
  color: var(--text-50);
  margin-top: 16px;
}

.edu-line {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--text-50);
  font-size: 13px;
}

.edu-line strong {
  color: var(--text);
  font-weight: 500;
}

/* ── Experience accordion ───────────────────────────────────────────────── */

.acc-group + .acc-group {
  margin-top: 32px;
}

.acc-group-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.acc-group-head h3 {
  font-family: var(--display);
  margin: 0;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-50);
}

.acc-note {
  font-size: 11px;
  color: var(--text-30);
  letter-spacing: 0.04em;
}

.acc-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.acc-item {
  border: 1px solid var(--line);
  transition: border-color 0.2s var(--ease);
}

.acc-item.is-open {
  border-color: var(--line-strong);
}

.acc-trigger {
  width: 100%;
  display: grid;
  /* five children: avatar, text, badge, period, chevron */
  grid-template-columns: auto minmax(0, 1fr) auto auto auto;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.2s var(--ease);
}

.acc-trigger:hover {
  background-color: var(--accent-wash);
}

.avatar {
  width: 38px;
  height: 38px;
  flex: none;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-50);
  border: 1px solid var(--line-strong);
  background: var(--panel);
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 4px;
}

.acc-role {
  display: block;
  color: var(--text);
  font-size: 15px;
}

.acc-org {
  display: block;
  color: var(--text-40);
  font-size: 13px;
  margin-top: 2px;
}

.acc-context {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-30);
  margin-top: 4px;
}

.acc-badge {
  font-family: var(--display);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-40);
  border: 1px solid var(--line);
  padding: 4px 9px;
  white-space: nowrap;
}

.acc-period {
  color: var(--text-30);
  font-size: 13px;
  white-space: nowrap;
}

.acc-chevron {
  color: var(--text-30);
  transition: transform 0.3s var(--ease);
  flex: none;
}

.acc-item.is-open .acc-chevron {
  transform: rotate(180deg);
  color: var(--accent);
}

.acc-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.35s var(--ease);
}

.acc-item.is-open .acc-panel {
  grid-template-rows: 1fr;
}

.acc-panel > .acc-clip {
  overflow: hidden;
  min-height: 0;
}

.acc-body {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
  gap: 28px;
  padding: 4px 20px 22px 74px;
  border-top: 1px solid var(--line);
  margin-top: -1px;
  padding-top: 20px;
}

.acc-summary {
  margin: 0 0 14px;
  color: var(--text-70);
  font-size: 14px;
  line-height: 1.7;
}

.bullets {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 9px;
}

.bullets li {
  position: relative;
  padding-left: 14px;
  color: var(--text-50);
  font-size: 13.5px;
  line-height: 1.65;
}

.bullets li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 9px;
  width: 4px;
  height: 4px;
  background: var(--accent);
}

.stat {
  color: var(--text);
  font-weight: 600;
}

/* Right-hand detail panel */
.acc-aside {
  border-left: 1px solid var(--line);
  padding-left: 24px;
  align-self: start;
}

.aside-block + .aside-block {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.aside-label {
  font-family: var(--display);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-30);
  margin: 0 0 10px;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-50);
  border: 1px solid var(--line);
  padding: 4px 8px;
  white-space: nowrap;
}

.lane-chip {
  font-family: var(--display);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 5px 10px;
  cursor: pointer;
  color: var(--accent);
  border: 1px solid var(--accent-line);
  transition: background-color 0.2s var(--ease);
}

.lane-chip:hover {
  background-color: var(--accent-wash);
}

/* Promotion timeline */
.progression {
  list-style: none;
  margin: 0;
  padding: 0 0 0 14px;
  position: relative;
  display: grid;
  gap: 12px;
}

.progression::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 6px;
  bottom: 6px;
  width: 1px;
  background: var(--line-strong);
}

.progression li {
  position: relative;
}

.progression li::before {
  content: "";
  position: absolute;
  left: -14px;
  top: 6px;
  width: 5px;
  height: 5px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
}

.progression li.is-current::before {
  background: var(--accent);
  border-color: var(--accent);
}

.progression-role {
  display: block;
  font-size: 13px;
  color: var(--text-50);
  line-height: 1.4;
}

.progression li.is-current .progression-role {
  color: var(--text);
}

.progression-note {
  display: block;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-30);
  margin-top: 3px;
}

@media (max-width: 760px) {
  .acc-body {
    grid-template-columns: 1fr;
    padding-left: 20px;
  }
  .acc-aside {
    border-left: none;
    border-top: 1px solid var(--line);
    padding-left: 0;
    padding-top: 18px;
  }
}

@media (max-width: 620px) {
  .acc-trigger {
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 12px;
  }
  .acc-badge {
    display: none;
  }
  .acc-period {
    grid-column: 2;
    grid-row: 2;
    font-size: 12px;
  }
  .acc-trigger .avatar {
    grid-row: 1 / span 2;
  }
  .acc-chevron {
    grid-column: 3;
    grid-row: 1;
  }
}

/* ── Portfolio buttons ──────────────────────────────────────────────────── */

.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}

.portfolio-btn {
  border: 1px solid var(--line-strong);
  padding: 20px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.2s var(--ease), background-color 0.2s var(--ease);
}

.portfolio-btn:hover {
  border-color: var(--accent-line);
  background-color: var(--accent-wash);
}

.portfolio-btn h3 {
  font-family: var(--display);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.1em;
  margin: 0 0 4px;
}

.portfolio-btn p {
  color: var(--text-40);
  font-size: 12px;
  margin: 0 0 12px;
}

.portfolio-btn svg {
  color: var(--text-30);
}

/* ── Project grid ───────────────────────────────────────────────────────── */

.proj-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  align-items: start;
}

.proj-card {
  width: 100%;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  overflow: hidden;
  transition: border-color 0.2s var(--ease);
}

.proj-card:hover {
  border-color: var(--accent-line);
}

.proj-media {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.proj-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.proj-plate {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--panel);
}

.proj-plate span {
  font-family: var(--mono);
  font-size: 30px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-30);
}

.proj-text {
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.proj-title {
  margin: 0;
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
}

.proj-sub {
  margin: 0;
  font-size: 12.5px;
  color: var(--text-40);
}

.proj-meta {
  margin: 8px 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--text-30);
}

/* ── Modal ──────────────────────────────────────────────────────────────── */

.modal-scrim {
  position: fixed;
  inset: 0;
  z-index: 120;
  background: rgba(0, 0, 0, 0.92);
  display: grid;
  place-items: center;
  padding: 20px;
}

.modal {
  background: var(--bg);
  border: 1px solid var(--line-strong);
  width: min(860px, 100%);
  max-height: 88vh;
  overflow-y: auto;
}

.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 24px 24px 0;
}

.modal-title {
  font-family: var(--display);
  margin: 6px 0 4px;
  font-size: 20px;
  font-weight: 300;
  letter-spacing: 0.04em;
  color: var(--text);
}

.modal-sub {
  margin: 0;
  color: var(--text-40);
  font-size: 13px;
}

.modal-close {
  cursor: pointer;
  color: var(--text-40);
  padding: 8px;
  border: 1px solid var(--line);
  flex: none;
  display: inline-flex;
  transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
}
.modal-close:hover {
  color: var(--text);
  border-color: var(--line-strong);
}

.modal-body {
  padding: 20px 24px 26px;
  display: grid;
  gap: 20px;
}

.modal-gallery {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  align-items: start;
}

.modal-shot {
  border: 1px solid var(--line);
  margin: 0;
}

.modal-shot img {
  width: 100%;
  height: auto;
}

.modal-shot figcaption {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-30);
  padding: 8px 10px;
  border-top: 1px solid var(--line);
  margin: 0;
}

.modal-note {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-30);
  border-left: 1px solid var(--accent);
  padding-left: 11px;
  margin: 0;
}

.link-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.link-pill {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--text-50);
  border: 1px solid var(--line-strong);
  padding: 10px 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
}

.link-pill:hover {
  color: var(--text);
  border-color: var(--accent-line);
}

/* ── Reel ───────────────────────────────────────────────────────────────── */

.reel {
  position: relative;
  aspect-ratio: 16 / 9;
  border: 1px solid var(--line);
  background: var(--panel);
  display: grid;
  place-items: center;
  overflow: hidden;
  width: 100%;
}

.reel iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.reel-play {
  display: grid;
  place-items: center;
  gap: 12px;
  cursor: pointer;
  color: var(--text-40);
  font-family: var(--display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.reel-play .ring {
  width: 56px;
  height: 56px;
  border: 1px solid var(--line-strong);
  display: grid;
  place-items: center;
  transition: border-color 0.2s var(--ease);
}

.reel-play:hover .ring {
  border-color: var(--accent-line);
}

/* ── Skills ─────────────────────────────────────────────────────────────── */

.skill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 20px;
}

.skill-block h4 {
  font-family: var(--display);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-30);
  margin: 0 0 10px;
}

/* ── Connect ────────────────────────────────────────────────────────────── */

.connect-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.connect-btn {
  border: 1px solid var(--line-strong);
  padding: 12px;
  color: var(--text-50);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
}

.connect-btn:hover {
  color: var(--text);
  border-color: var(--accent-line);
}

/* ── Lane page header ───────────────────────────────────────────────────── */

.lane-head h1 {
  font-family: var(--display);
  color: var(--text);
  font-size: clamp(26px, 5vw, 40px);
  font-weight: 200;
  letter-spacing: 0.18em;
  margin: 0 0 10px;
  text-transform: uppercase;
}

.lane-head p.lane-tagline {
  font-family: var(--display);
  color: var(--text-40);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin: 0 0 18px;
}

.lane-head p.lane-blurb {
  color: var(--text-50);
  font-size: 14px;
  line-height: 1.7;
  max-width: 68ch;
  margin: 0;
}

.back-link {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-40);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  transition: color 0.2s var(--ease);
}

.back-link:hover {
  color: var(--text);
}

/* ── Fish cursor ────────────────────────────────────────────────────────── */

.fish-layer {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s var(--ease);
  will-change: transform;
}

.fish-body {
  position: absolute;
  left: -19px;
  top: -12px;
  width: 38px;
  height: 24px;
  transform: rotate(var(--fish-angle, 0deg)) scaleY(var(--fish-flip, 1));
  transform-origin: 50% 50%;
}

.fish-tail {
  transform-origin: 27px 12px;
  animation: fish-swim 0.62s ease-in-out infinite;
}

.fish-fin {
  transform-origin: 18px 14px;
  animation: fish-swim 0.62s ease-in-out infinite reverse;
}

@keyframes fish-swim {
  0%,
  100% {
    transform: rotate(11deg);
  }
  50% {
    transform: rotate(-11deg);
  }
}

body.fish-cursor-on,
body.fish-cursor-on * {
  cursor: none;
}
body.fish-cursor-on input,
body.fish-cursor-on textarea {
  cursor: text;
}

.fish-toggle {
  font-family: var(--display);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-30);
  border: 1px solid var(--line);
  padding: 8px 12px;
  cursor: pointer;
  transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
}
.fish-toggle:hover {
  color: var(--text-70);
  border-color: var(--line-strong);
}

/* ── Footer ─────────────────────────────────────────────────────────────── */

.footer {
  border-top: 1px solid var(--line);
  padding: 28px 0 40px;
  margin-top: 64px;
}

.footer-inner {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-30);
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.footer a {
  text-decoration: none;
}

/* ── Version badge ──────────────────────────────────────────────────────── */

.version-badge {
  position: fixed;
  right: 10px;
  bottom: 8px;
  z-index: 90;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--text);
  opacity: 0.12;
  user-select: all;
  transition: opacity 0.25s var(--ease);
}

.version-badge:hover {
  opacity: 0.8;
}

</style>

 * Bump this whenever you ship a change, so you can tell at a glance which build

 *

 */
const VERSION = '1.4.0';
const BUILD_DATE = '2026-08-08';

const VERSION_LABEL = `v${VERSION} · ${BUILD_DATE}`;

/**
 * Entity — the abstract base every portfolio object inherits from.
 *
 * This is deliberately abstract: constructing an Entity directly throws.
 * Subclasses (Project, Experience) supply their own identity and their own
 * answers to `kindLabel` / `accentVar`, which is what lets the components
 * render any item without type-checking it.
 */

let autoId = 0;

class Entity {
  constructor({ id, title = '' } = {}) {
    if (new.target === Entity) {
      throw new TypeError('Entity is abstract — extend it rather than constructing it directly.');
    }
    this.id = id ?? `entity-${++autoId}`;
    this.title = title;
  }

  /** URL-safe version of the title, used for anchors and React keys. */
  get slug() {
    return String(this.title)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');

   * Subclasses override these two. Together they mean a component can render
   * any Entity — its badge text and its accent colour come from the object
   * itself, so there is never an `if (type === 'art')` branch in the UI.
   */
  get kindLabel() {
    return 'ITEM';
  }

  /**
   * One accent for the whole site, matching the original design. Subclasses can
   * override this if per-section colour is ever wanted again.
   */
  get accentVar() {
    return '--accent';
  }

  /** Everything a search box should look at. Subclasses widen this. */
  get searchText() {
    return this.title;
  }

  matches(query) {
    if (!query) return true;
    return this.searchText.toLowerCase().includes(String(query).toLowerCase());
  }

  toJSON() {
    return { id: this.id, title: this.title, kind: this.kindLabel };
  }

  toString() {
    return this.title;
  }
}

 * Project — a single piece of work shown as a card.

  constructor(data = {}) {
    super({ id: data.id, title: data.title });

    this.subtitle = data.subtitle ?? '';
    this.year = data.year ?? '';
    this.role = data.role ?? '';
    this.tools = data.tools ?? [];
    this.bullets = data.bullets ?? [];
    this.media = data.media ?? [];
    this.links = data.links ?? [];
    this.tags = data.tags ?? [];
    this.lanes = data.lanes ?? [];
    this.featured = Boolean(data.featured);
    this.note = data.note ?? '';
  }

  get kindLabel() {
    return 'PROJECT';
  }

  get cover() {
    return this.media[0] ?? null;
  }

  get hasMedia() {
    return this.media.length > 0;
  }

  /** Two letters used on the typographic plate when a project has no image. */
  get plate() {
    const words = this.title.replace(/[^A-Za-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
    return (words.slice(0, 2).map((w) => w[0]).join('') || '··').toUpperCase();
  }

  get metaLine() {
    return this.tools.join(' / ');
  }

  get searchText() {
    return [this.title, this.subtitle, ...this.tools, ...this.tags].join(' ');
  }

  belongsTo(laneKey) {
    return this.lanes.includes(laneKey);
  }

  /** Featured work first, then most recent. */
  static compare(a, b) {
    if (a.featured !== b.featured) return a.featured ? -1 : 1;
    return String(b.year).localeCompare(String(a.year));
  }
}

 * Experience — one row of the experience accordion.
 *
 * Subclasses change the badge, the accent, and the small context line that sits

 * says where it was and whether it was hybrid.
 */
class Experience extends Entity {
  constructor(data = {}) {
    super({ id: data.id, title: data.role });

    this.role = data.role ?? '';
    this.org = data.org ?? '';
    this.orgShort = data.orgShort ?? data.org ?? '';
    this.start = data.start ?? '';
    this.end = data.end ?? null; // null means current
    this.startISO = data.startISO ?? '';
    this.location = data.location ?? '';
    this.mode = data.mode ?? '';
    this.client = data.client ?? '';
    this.summary = data.summary ?? '';
    this.bullets = data.bullets ?? [];
    this.tools = data.tools ?? [];
    this.lanes = data.lanes ?? [];
    this.highlight = data.highlight ?? null; // { value, label }
    this.logo = data.logo ?? null; // optional path to a real logo file
    this.brand = data.brand ?? '#6E7F91';

    // Earlier titles held in the same organisation, oldest first.
    // e.g. Ambassador → Vice President, or Art Designer → Art Director.
    this.progression = data.progression ?? [];
  }

  get kindLabel() {
    return 'ROLE';
  }

  get isCurrent() {
    return this.end === null;
  }

  get hasProgression() {
    return this.progression.length > 1;
  }

  /** Empty when dates are unknown, so the UI can hide the line entirely. */
  get period() {
    if (!this.start) return '';
    return `${this.start} — ${this.end ?? 'Present'}`;
  }

  /**
   * Fallback monogram for the circular avatar when there is no logo file.
   * Splits on spaces and on internal capitals, so "DraftKings" reads DK while
   * a single lowercase word like "Goodwin" falls back to its first two letters.
   */
  get initials() {
    const words = this.orgShort
      .replace(/[^A-Za-z0-9 ]/g, ' ')
      .split(/\s+/)
      .flatMap((word) => word.split(/(?=[A-Z][a-z])/))
      .filter(Boolean);

    if (words.length >= 2) {
      return (words[0][0] + words[1][0]).toUpperCase();
    }
    return (words[0] ?? '··').slice(0, 2).toUpperCase();
  }

  /** The small line under the org name. Overridden by ClientProjectExperience. */
  get contextLine() {
    return [this.location, this.mode].filter(Boolean).join(' · ');
  }

  get searchText() {
    return [this.role, this.org, ...this.tools, ...this.bullets].join(' ');
  }

  belongsTo(laneKey) {
    return this.lanes.includes(laneKey);
  }

  /** Most recent first. */
  static compare(a, b) {
    return String(b.startISO).localeCompare(String(a.startISO));
  }
}

/**
 * Lane — one of the three portfolio sections (3D Art, Tech Art, Product + Marketing).
 * Owns its projects and knows how to sort and find them.
 */
class Lane {
  constructor({ key, label, short, tagline, blurb, accentVar, reelId = null, projects = [] }) {
    this.key = key;
    this.label = label;
    this.short = short ?? label;
    this.tagline = tagline ?? '';
    this.blurb = blurb ?? '';
    this.accentVar = accentVar ?? '--accent';
    this.reelId = reelId;
    this._projects = projects;
  }

  get projects() {
    return [...this._projects].sort(Project.compare);
  }

  get featured() {
    return this.projects.filter((p) => p.featured);
  }

/**
 * ExperienceGroup — a labelled block inside the accordion
 * (Professional Experience / Client Projects / Leadership & Volunteering).
 */
class ExperienceGroup {
  constructor({ key, label, note = '', items = [] }) {
    this.key = key;
    this.label = label;
    this.note = note;
    this._items = items;
  }

  get items() {
    return [...this._items].sort(Experience.compare);
  }

  get count() {
    return this._items.length;
  }

  /** Only the roles that are relevant to a given lane. */

    return this.items.filter((item) => item.belongsTo(laneKey));
  }
}

/**
 * Portfolio — the root aggregate. Everything the UI needs hangs off one object,
 * built once from plain data by the static factory below.
 */
class Portfolio {
  constructor({ profile, lanes = [], groups = [] }) {
    this.profile = profile;
    this.lanes = lanes;
    this.groups = groups;
  }

  lane(key) {
    return this.lanes.find((l) => l.key === key) ?? null;
  }

  get laneKeys() {
    return this.lanes.map((l) => l.key);
  }

  /** Every experience across every group, newest first. */
  get allExperiences() {
    return this.groups.flatMap((g) => g.items).sort(Experience.compare);
  }

  /** Groups filtered down to one lane, with empty groups dropped. */
  groupsForLane(laneKey) {
    return this.groups
      .map((g) => new ExperienceGroup({ ...g, key: g.key, label: g.label, note: g.note, items: g.forLane(laneKey) }))
      .filter((g) => g.count > 0);
  }

  experiencesFor(laneKey) {
    return this.allExperiences.filter((e) => e.belongsTo(laneKey));
  }

  /**
   * Factory. Reads the plain objects in portfolio.data.js and instantiates the
   * right subclass for each one based on its `type` field.
   */
  static from(data) {
    const lanes = (data.lanes ?? []).map(
      (lane) =>
        new Lane({
          ...lane,
          projects: (lane.projects ?? []).map((p) => {
            const ProjectClass = PROJECT_TYPES[p.type] ?? PROJECT_TYPES.art;
            return new ProjectClass({ ...p, lanes: p.lanes ?? [lane.key] });
          }),
        })
    );

    const groups = (data.experienceGroups ?? []).map(
      (group) =>
        new ExperienceGroup({
          ...group,
          items: (group.items ?? []).map((e) => {
            const ExperienceClass = EXPERIENCE_TYPES[e.type] ?? EXPERIENCE_TYPES.internship;
            return new ExperienceClass(e);
          }),
        })
    );

    return new Portfolio({ profile: data.profile, lanes, groups });
  }
}

/**
 * FishCursor — drives the fish that follows the pointer.
 *
 * Efficiency notes, because this runs on every mouse move:
 *  - One requestAnimationFrame loop, and it stops itself once the fish has
 *    caught up with the pointer. An idle page runs zero frames.
 *  - The pointermove listener is passive and only stores two numbers.
 *  - Each frame writes `transform` plus two custom properties. Nothing that
 *    triggers layout or paint, so the compositor handles it on its own.
 *  - No React state is involved, so moving the mouse never re-renders the page.
 */
class FishCursor {
  /** Pointer must be a real mouse, and the visitor must not have asked for less motion. */
  static isSupported() {
    if (typeof window === 'undefined' || !window.matchMedia) return false;
    return (
      window.matchMedia('(pointer: fine)').matches &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches
    );
  }

  constructor(element, { ease = 0.16, turnEase = 0.22 } = {}) {
    this.el = element;
    this.ease = ease;
    this.turnEase = turnEase;

    this.pos = { x: -200, y: -200 };
    this.target = { x: -200, y: -200 };
    this.angle = 0;
    this.flip = 1;

    this.frame = null;
    this.running = false;
    this.hasSeenPointer = false;

    this._onMove = this._onMove.bind(this);
    this._onLeave = this._onLeave.bind(this);
    this._onEnter = this._onEnter.bind(this);
    this._tick = this._tick.bind(this);
  }

  attach() {
    if (!this.el) return this;
    window.addEventListener('pointermove', this._onMove, { passive: true });
    document.addEventListener('pointerleave', this._onLeave);
    document.addEventListener('pointerenter', this._onEnter);
    document.body.classList.add('fish-cursor-on');
    return this;
  }

  detach() {
    window.removeEventListener('pointermove', this._onMove);
    document.removeEventListener('pointerleave', this._onLeave);
    document.removeEventListener('pointerenter', this._onEnter);
    document.body.classList.remove('fish-cursor-on');
    this._stop();
    if (this.el) this.el.style.opacity = '0';
    this.hasSeenPointer = false;
  }

  _onMove(event) {
    this.target.x = event.clientX;
    this.target.y = event.clientY;

    // First sighting: drop the fish straight onto the pointer instead of
    // letting it swim in from the corner.
    if (!this.hasSeenPointer) {
      this.hasSeenPointer = true;
      this.pos.x = event.clientX;
      this.pos.y = event.clientY;
      this.el.style.opacity = '1';
    }

    this._start();
  }

  _onLeave() {
    if (this.el) this.el.style.opacity = '0';
  }

  _onEnter() {
    if (this.el && this.hasSeenPointer) this.el.style.opacity = '1';
  }

  _start() {
    if (this.running) return;
    this.running = true;
    this.frame = requestAnimationFrame(this._tick);
  }

  _stop() {
    this.running = false;
    if (this.frame !== null) cancelAnimationFrame(this.frame);
    this.frame = null;
  }

  _tick() {
    const dx = this.target.x - this.pos.x;
    const dy = this.target.y - this.pos.y;

    this.pos.x += dx * this.ease;
    this.pos.y += dy * this.ease;

    const speed = Math.hypot(dx, dy);

    // Only steer when actually moving, so the fish holds its heading at rest.
    if (speed > 1.5) {
      let desired = (Math.atan2(dy, dx) * 180) / Math.PI;

      // Swimming left would put the fish upside down, so mirror it vertically
      // and steer by the mirrored angle instead.
      const facingLeft = Math.abs(desired) > 90;
      this.flip = facingLeft ? -1 : 1;
      if (facingLeft) desired = desired > 0 ? desired - 180 : desired + 180;

      let delta = desired - this.angle;
      while (delta > 180) delta -= 360;
      while (delta < -180) delta += 360;
      this.angle += delta * this.turnEase;
    }

    this.el.style.transform = `translate3d(${this.pos.x}px, ${this.pos.y}px, 0)`;
    this.el.style.setProperty('--fish-angle', `${this.angle.toFixed(2)}deg`);
    this.el.style.setProperty('--fish-flip', String(this.flip));

    // Caught up with the pointer, so stop burning frames until it moves again.
    if (speed < 0.25) {
      this._stop();
      return;
    }

    this.frame = requestAnimationFrame(this._tick);
  }
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>

/** **bold** → highlighted stat, matching the React <Rich> component. */
const rich = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong class="stat">$1</strong>');

  linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-10h4v1.5"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/>',

  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  boat: '<path d="M12 3v9" stroke-width="1.4"/><path d="M12.9 4.2 18 10.2a.5.5 0 0 1-.4.8h-4.7V4.5c0-.5.6-.7.9-.3Z" fill="currentColor" stroke="none"/><path d="M3.4 14h17.2l-2.2 4.7a2 2 0 0 1-1.8 1.1H7.4a2 2 0 0 1-1.8-1.1L3.4 14Z" stroke-width="1.4"/>',
};
const icon = (name, size = 18, cls = '') =>
  `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

const portfolio = Portfolio.from(portfolioData);
const state = { view: 'home', open: null, modal: null };

const tagRow = (items) =>
  !items || !items.length ? '' :
  `<div class="tag-row">${items.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;

const bullets = (items) =>
  !items || !items.length ? '' :
  `<ul class="bullets">${items.map((b) => `<li><span>${rich(b)}</span></li>`).join('')}</ul>`;

/** Logo when the file exists, monogram when it doesn't. */
const avatar = (e) => e.logo
  ? `<div class="avatar"><img src="${esc(e.logo)}" alt="" loading="lazy"
       onerror="this.parentNode.textContent='${esc(e.initials)}'"></div>`
  : `<div class="avatar">${esc(e.initials)}</div>`;

function accordionRow(e) {
  const open = state.open === e.id;
  return `
  <div class="acc-item${open ? ' is-open' : ''}">
    <button type="button" class="acc-trigger" data-acc="${esc(e.id)}" aria-expanded="${open}">
      ${avatar(e)}
      <span>
        <span class="acc-role">${esc(e.role)}</span>
        <span class="acc-org">${esc(e.org)}</span>
        ${e.contextLine ? `<span class="acc-context">${esc(e.contextLine)}</span>` : ''}
      </span>
      <span class="acc-badge">${esc(e.kindLabel)}</span>
      <span class="acc-period">${esc(e.period)}</span>
      ${icon('chevron', 16, 'acc-chevron')}
    </button>
    <div class="acc-panel"><div class="acc-clip"><div class="acc-body">
      <div>
        ${e.summary ? `<p class="acc-summary">${rich(e.summary)}</p>` : ''}
        ${bullets(e.bullets)}
      </div>
      <aside class="acc-aside">
        ${e.hasProgression ? `<div class="aside-block">
            <p class="aside-label">Progression</p>
            <ol class="progression">${e.progression.map((s, i) => `
              <li class="${i === e.progression.length - 1 ? 'is-current' : ''}">
                <span class="progression-role">${esc(s.role)}</span>
                ${s.note ? `<span class="progression-note">${esc(s.note)}</span>` : ''}
              </li>`).join('')}</ol></div>` : ''}
        ${e.tools && e.tools.length ? `<div class="aside-block">
            <p class="aside-label">Tools &amp; methods</p>${tagRow(e.tools)}</div>` : ''}
        ${e.lanes && e.lanes.length ? `<div class="aside-block">
            <p class="aside-label">Related work</p>
            <div class="tag-row">${e.lanes.map((l) =>
              `<button type="button" class="lane-chip" data-nav="${l}">${LANE_LABELS[l]}</button>`).join('')}</div></div>` : ''}
      </aside>
    </div></div></div>
  </div>`;
}

const accordion = (groups) => groups.map((g) => `

    <header class="acc-group-head"><h3>${esc(g.label)}</h3>

function lanePage(lane) {
  const groups = portfolio.groupsForLane(lane.key);

function modalMarkup() {
  if (!state.modal) return '';
  const p = state.modal;
  return `
  <div class="modal-scrim" data-close-modal><div class="modal">
    <div class="modal-head">
      <div><h2 class="modal-title">${esc(p.title)}</h2>

      <button type="button" class="modal-close" data-close-modal aria-label="Close">${icon('x', 16)}</button>

    <div class="modal-body">
      ${p.hasMedia ? `<div class="modal-gallery">${p.media.map((m) => `
        <figure class="modal-shot"><img src="${m.src}" alt="${esc(m.alt || p.title)}" loading="lazy">

      ${bullets(p.bullets)}
      ${p.note ? `<p class="modal-note">${esc(p.note)}</p>` : ''}
      ${p.tools && p.tools.length ? `<div><p class="aside-label">Tools</p>${tagRow(p.tools)}</div>` : ''}
      ${p.links && p.links.length ? `<div class="link-row">${p.links.map((l) =>
        `<a class="link-pill" href="${esc(l.href)}" target="_blank" rel="noreferrer noopener">${esc(l.label)}</a>`).join('')}</div>` : ''}
    </div>
  </div></div>`;
}

      <path d="M27.5 12c0 5-6 8.7-12.8 8.7C7.9 20.7 1.4 17 1.4 12S7.9 3.3 14.7 3.3C21.5 3.3 27.5 7 27.5 12Z" fill="var(--accent)"/>
      <path class="fish-fin" d="M15.8 19.5c1.4 1.6 3.2 2.7 5 3.1.6.2 1.1-.5.8-1a11 11 0 0 1-1.2-3.8Z" fill="var(--accent)" opacity=".7"/>

}

document.addEventListener('click', (ev) => {
  const nav = ev.target.closest('[data-nav]');
  if (nav) { state.view = nav.dataset.nav; state.open = null; state.modal = null; render(); window.scrollTo(0, 0); return; }

  const acc = ev.target.closest('[data-acc]');
  if (acc) { state.open = state.open === acc.dataset.acc ? null : acc.dataset.acc; render(); return; }

  const proj = ev.target.closest('[data-proj]');
  if (proj) {
    const lane = portfolio.lane(state.view);
    state.modal = lane ? lane.find(proj.dataset.proj) : null;
    render(); return;
  }
  if (ev.target.closest('.modal-close') || ev.target.classList.contains('modal-scrim')) {
    state.modal = null; render();
  }
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && state.modal) { state.modal = null; render(); }
});

let fishInstance = null;
let fishOn = FishCursor.isSupported();

function mountFish() {
  const el = document.getElementById('fish');
  if (fishInstance) fishInstance.detach();
  fishInstance = null;
  if (fishOn && el && FishCursor.isSupported()) fishInstance = new FishCursor(el).attach();
  const btn = document.getElementById('fishToggle');
  if (btn) {
    btn.textContent = 'Fish cursor: ' + (fishOn ? 'on' : 'off');
    btn.onclick = (e) => { e.stopPropagation(); fishOn = !fishOn; render(); };
  }
}

render();
